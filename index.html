<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC DREAM COMPUTER STORE</title>
  <meta name="description" content="PC DREAM COMPUTER STORE - PC, parts, accessories and more.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% -10%, rgba(117, 0, 102, 0.678), transparent 35%),
        linear-gradient(160deg, #17004d 0%, #17004d 45%, #17004d 100%);
      display: flex;
      justify-content: center;
      padding: 35px 16px 45px;
    }
    .page {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    .logo {
  width: 92px;
  height: 92px;
  margin: 0 auto 16px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(0, 100, 255, .28);
  border: 2px solid rgba(255,255,255,.18);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
    h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }
    .handle {
      margin-top: 6px;
      color: #a9bdd4;
      font-size: 14px;
    }
    .bio {
      margin: 13px auto 23px;
      max-width: 450px;
      color: #d8e3ef;
      line-height: 1.5;
      font-size: 14px;
    }
    .links {
      display: grid;
      gap: 13px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 15px 20px;
      border-radius: 15px;
      color: #fff;
      text-decoration: none;
      font-weight: 750;
      font-size: 15px;
      background: rgba(255,255,255,.095);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(10px);
      transition: .2s ease;
      box-shadow: 0 7px 20px rgba(0,0,0,.16);
    }
    .link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.15);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }
    .link.primary {
      background: linear-gradient(135deg, #fa7629, #fa640d);
      border-color: transparent;
    }
    .icon {
      width: 25px;
      margin-right: 10px;
      font-size: 20px;
    }
    .icon img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  display: block;
}
    .section {
      margin: 25px 0 12px;
      color: #8fa8c2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    footer {
      margin-top: 28px;
      color: #71869c;
      font-size: 11px;
    }
    @media (max-width: 420px) {
      body { padding-top: 25px; }
      .logo { width: 82px; height: 82px; font-size: 18px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- PALITAN ANG "PD" NG LOGO IMAGE KUNG GUSTO MO -->
    <div class="logo">
  <img src="logo.png" alt="PC DREAM Computer Store Logo">
</div>

    <h1>PC DREAM COMPUTER STORE</h1>
    <div class="handle">@PCDreamComputerStore</div>

    <p class="bio">
      🖥️ PC • Parts • Accessories<br>
      💳 Installment Available • 🛒 Online Orders
    </p>

    <div class="links">

      <!-- PALITAN ANG # NG ACTUAL LINKS MO -->

      <a class="link primary" href="https://shopee.ph/ianuanan?categoryId=100644&entryPoint=ShopByPDP&itemId=53660954437" target="_blank">
       <span class="icon">
    <img src="shopee.png" alt="Shopee">
  </span>
  SHOP NOW — SHOPEE
      </a>

      <a class="link" href="https://www.facebook.com/profile.php?id=61579262114802" target="_blank">
  <span class="icon">
    <img src="fb-logo.png" alt="Facebook">
  </span>
  FACEBOOK PAGE
</a>

      <a class="link" href="https://www.tiktok.com/@pc.dream.computer" target="_blank">
        <span class="icon">
    <img src="Tiktok.png" alt="Tiktok">
  </span>
  TIKTOK
      </a>

      <a class="link" href="https://www.messenger.com/t/762949423572366" target="_blank">
        <span class="icon">
    <img src="messenger.png" alt="messenger">
  </span>
  MESSAGE US
      </a>

      <a class="link" href="https://maps.app.goo.gl/eYCVJ11igWm6aMQy7" target="_blank">
        <span class="icon">📍</span> STORE LOCATION — GOOGLE MAPS
      </a>


    </div>

    <footer>© 2026 PC DREAM COMPUTER STORE</footer>
  </main>
</body>
</html>
